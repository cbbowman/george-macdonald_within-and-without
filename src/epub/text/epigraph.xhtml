		<section id="epigraph" epub:type="epigraph">
			<blockquote epub:type="z3998:verse">
				<p>
					<span>What life it is, and how that all these lives do gather⁠—</span>
					<br/>
					<span>With outward maker’s force, or like an inward father.</span>
				</p>
				<cite>SIR PHILIP SIDNEY’S <i>Arcadia</i></cite>
			</blockquote>
			<p>Written December and January, 1850⁠–⁠51.</p>
		</section>
